<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ひだまり</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23C8873C'/%3E%3C/svg%3E">
<style>
:root{
  --ground:#E9ECF0; --surface:#fff; --surface-2:#F3F5F8; --line:#D3D9E0;
  --ink:#191E25; --ink-2:#4A5563; --muted:#78838F;
  --accent:#C8873C; --accent-soft:#F2E2CB; --accent-ink:#7A4F16;
  --cool:#4F8299; --cool-soft:#DCE9EF; --ok:#5F8C6B;
  --sky:#DCE4EC; --floor:#D8CDBC; --wall:#C4CBD3;
  --shadow:0 1px 2px rgba(25,30,37,.06),0 8px 24px -12px rgba(25,30,37,.18);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --ground:#13171C; --surface:#1B2128; --surface-2:#222932; --line:#303945;
  --ink:#E7EBF0; --ink-2:#AFBAC6; --muted:#7C8794;
  --accent:#E0A85C; --accent-soft:#3A2E1C; --accent-ink:#F0C88C;
  --cool:#79ABC2; --cool-soft:#1E2C34; --ok:#84B08F;
  --sky:#1A2028; --floor:#4A4237; --wall:#39424D;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7);
  color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overscroll-behavior:none}
body{background:var(--ground);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  font-size:15px;-webkit-font-smoothing:antialiased;overflow:hidden}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}

#stage{position:fixed;inset:0;touch-action:none}
#stage canvas{display:block;width:100%;height:100%}

.hud{position:fixed;top:12px;left:12px;z-index:10;background:var(--surface);
  border:1px solid var(--line);border-radius:12px;padding:10px 11px;box-shadow:var(--shadow);min-width:190px}
.hud .k{display:flex;justify-content:space-between;gap:14px;font-size:11px;color:var(--muted);line-height:1.8}
.hud .k b{color:var(--ink);font-weight:500}
.hud .net{margin-top:7px;padding-top:7px;border-top:1px solid var(--line);font-size:11px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:5px}
.dot.on{background:var(--ok)}

.panel{position:fixed;top:12px;right:12px;z-index:10;background:var(--surface);
  border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);width:216px;overflow:hidden}
.panel h3{margin:0;padding:11px 14px 9px;font-size:12.5px;border-bottom:1px solid var(--line)}
.panel ul{list-style:none;margin:0;padding:6px 8px;max-height:40vh;overflow:auto}
.panel li{display:flex;align-items:center;gap:8px;padding:5px 6px;font-size:13px;border-radius:7px}
.panel li.me{background:var(--surface-2)}
.av{width:18px;height:18px;border-radius:50%;flex:none;box-shadow:inset 0 -4px 6px rgba(0,0,0,.15)}
.st{margin-left:auto;font-size:10px;padding:1px 7px;border-radius:999px;background:var(--surface-2);
  color:var(--muted);border:1px solid var(--line)}
.st.open{color:var(--ok)} .st.focus{color:var(--cool)}
.st.meet{color:var(--accent-ink);background:var(--accent-soft);border-color:transparent}

.bar{position:fixed;left:12px;right:12px;bottom:12px;z-index:10;height:54px;background:var(--surface);
  border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);
  display:flex;align-items:center;gap:8px;padding:0 12px}
.ctl{border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:9px;
  padding:8px 13px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.ctl:disabled{opacity:.45;cursor:not-allowed}
.ctl.live{background:var(--accent);border-color:transparent;color:#fff;font-weight:700}
.hint{margin-left:auto;font-size:11.5px;color:var(--muted);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
@media (max-width:560px){.hint{display:none}}

.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);z-index:20;background:var(--ink);
  color:var(--ground);padding:9px 17px;border-radius:999px;font-size:13px;box-shadow:var(--shadow);
  opacity:0;pointer-events:none;transition:opacity .25s}
.toast.on{opacity:1}
#boot{position:fixed;inset:0;display:grid;place-items:center;z-index:30;background:var(--ground);
  color:var(--muted);font-size:14px}
@media (max-width:820px){.panel{display:none}}
</style>
</head>
<body>
<div id="stage"></div>

<div class="hud">
  <div class="k"><span>fps</span><b id="hFps">—</b></div>
  <div class="k"><span>draw calls</span><b id="hCalls">—</b></div>
  <div class="k"><span>tick</span><b id="hTick">—</b></div>
  <div class="k"><span>補正</span><b id="hFix">0</b></div>
  <div class="net"><span class="dot" id="netDot"></span><span id="netTxt">接続中…</span></div>
</div>

<aside class="panel">
  <h3 id="floorName">—</h3>
  <ul id="members"></ul>
</aside>

<div class="bar">
  <button class="ctl" id="actBtn" disabled>—</button>
  <select class="ctl" id="statusSel">
    <option value="open">オープン</option>
    <option value="focus">集中中</option>
    <option value="meet">会議中</option>
    <option value="away">離席</option>
  </select>
  <span class="hint" id="hint">WASD / 矢印で移動・クリックでも移動・席の上で E</span>
</div>

<div class="toast" id="toast"></div>
<div id="boot">読み込み中…</div>

<script type="importmap">
{ "imports": { "three": "/vendor/three.module.js", "three/": "/vendor/" } }
</script>
<script type="module" src="/src/app.js"></script>
</body>
</html>
