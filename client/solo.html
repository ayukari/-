<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ひだまり オフィス</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23C8873C'/%3E%3C/svg%3E">
<style>
/* 色は「ひだまり」の名のとおり、中間色をわずかに暖色へ寄せてある。
   床と什器が木なので、UI の灰色が冷たいと画面の中で浮く。
   ★ 外部フォントは読まない（03 の Won't「外部CDN・外部フォントを使わない」）。
     丸ゴシックは OS が持っているものだけを順に指名する。 */
:root{
  --ground:#EDEAE4; --surface:#FCFAF7; --surface-2:#F2EEE7; --line:#DCD6CC;
  --ink:#221E1A; --muted:#7C756B;
  --accent:#C8873C; --accent-ink:#7A4F16; --accent-soft:#F4E3CA;
  --cool:#4F8299; --ok:#5F8C6B;
  --lift:0 1px 2px rgba(34,30,26,.06), 0 10px 26px -14px rgba(34,30,26,.28);
  --ui:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic Medium","YuGothic",
       "Noto Sans JP",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#17150F; --surface:#221F19; --surface-2:#2B2721; --line:#3A342B;
    --ink:#EFE9DF; --muted:#8E867A;
    --accent:#E0A85C; --accent-ink:#F2CC92; --accent-soft:#3C2F1C;
    --cool:#7FAEC4; --ok:#87B392;
    --lift:0 1px 2px rgba(0,0,0,.45), 0 12px 30px -16px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#17150F; --surface:#221F19; --surface-2:#2B2721; --line:#3A342B;
  --ink:#EFE9DF; --muted:#8E867A;
  --accent:#E0A85C; --accent-ink:#F2CC92; --accent-soft:#3C2F1C;
  --cool:#7FAEC4; --ok:#87B392;
  --lift:0 1px 2px rgba(0,0,0,.45), 0 12px 30px -16px rgba(0,0,0,.8);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{margin:0;height:100%;overscroll-behavior:none}
body{background:var(--ground);color:var(--ink);overflow:hidden;font-family:var(--ui);font-size:15px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}

#stage{position:fixed;inset:0;touch-action:none}
#stage canvas{display:block;width:100%;height:100%}

/* 計測値は見るためだけのもの。触るものより一段静かにする */
.hud{position:fixed;top:max(12px,env(safe-area-inset-top));left:12px;z-index:10;
  padding:9px 12px;border-radius:11px;background:color-mix(in srgb,var(--surface) 82%,transparent);
  border:1px solid var(--line);backdrop-filter:blur(6px);min-width:178px}
.hud .k{display:flex;justify-content:space-between;gap:14px;font-size:11px;color:var(--muted);line-height:1.8}
.hud .k b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.hud .note{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);
  font-size:10.5px;color:var(--muted);line-height:1.55}

.card{background:var(--surface);border:1px solid var(--line);border-radius:13px;box-shadow:var(--lift)}

.panel{position:fixed;top:max(12px,env(safe-area-inset-top));right:12px;z-index:10;width:210px;overflow:hidden}
.panel h3{margin:0;padding:11px 14px 9px;font-size:12.5px;font-weight:600;border-bottom:1px solid var(--line);
  letter-spacing:.02em}
.panel ul{list-style:none;margin:0;padding:6px 8px;max-height:46vh;overflow:auto}
.panel li{display:flex;align-items:center;gap:8px;padding:4px 6px;font-size:12.5px;border-radius:8px}
.panel li.me{background:var(--surface-2)}
.av{width:16px;height:16px;border-radius:50%;flex:none;box-shadow:inset 0 -4px 6px rgba(0,0,0,.18)}
.st{margin-left:auto;font-size:10px;padding:1px 7px;border-radius:999px;background:var(--surface-2);
  color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.st.open{color:var(--ok)} .st.focus{color:var(--cool)}
.st.meet{color:var(--accent-ink);background:var(--accent-soft);border-color:transparent}

.bar{position:fixed;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));z-index:10;
  min-height:56px;display:flex;align-items:center;gap:8px;padding:9px 12px;flex-wrap:wrap}
.ctl{border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:9px;
  padding:9px 14px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.ctl:hover:not(:disabled){border-color:var(--muted)}
.ctl:disabled{opacity:.42;cursor:not-allowed}
/* いま押せる行動が、画面の中でいちばん強い要素 */
#actBtn:not(:disabled){background:var(--accent);border-color:transparent;color:#fff;font-weight:700}
#actBtn.live{background:var(--surface-2);border-color:var(--line);color:var(--ink);font-weight:400}
.hint{margin-left:auto;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.editor{position:fixed;right:12px;bottom:80px;z-index:12;width:268px;padding:13px 14px;display:none}
.editor.on{display:block}
.editor h3{margin:0 0 10px;font-size:13px;font-weight:600;display:flex;align-items:center;letter-spacing:.02em}
.editor h3 button{margin-left:auto;border:0;background:none;color:var(--muted);font-size:19px;
  line-height:1;cursor:pointer;padding:0 2px}
.row{display:flex;align-items:center;gap:9px;margin-bottom:7px;font-size:12px;color:var(--muted)}
.row span{width:50px;flex:none}
.row select{flex:1;font:inherit;font-size:12.5px;padding:6px 8px;border:1px solid var(--line);
  border-radius:8px;background:var(--surface-2);color:var(--ink)}
.editor .foot{margin-top:11px;padding-top:11px;border-top:1px solid var(--line);
  display:flex;gap:10px;align-items:center}
.editor .foot small{color:var(--muted);font-size:10.5px;line-height:1.45;font-variant-numeric:tabular-nums}

.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:20;background:var(--ink);
  color:var(--ground);padding:10px 18px;border-radius:999px;font-size:13px;box-shadow:var(--lift);
  opacity:0;pointer-events:none;transition:opacity .25s;max-width:86vw;text-align:center}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}

#boot{position:fixed;inset:0;display:grid;place-items:center;z-index:30;background:var(--ground);
  color:var(--muted);font-size:13.5px;text-align:center;padding:0 24px;line-height:1.9}
@media (max-width:860px){.panel{display:none}}
@media (max-width:620px){.hint{display:none}.editor{left:12px;right:12px;width:auto}}
</style>
</head>
<body>
<div id="stage"></div>

<div class="hud card">
  <div class="k"><span>fps</span><b id="hFps">—</b></div>
  <div class="k"><span>ドローコール</span><b id="hCalls">—</b></div>
  <div class="k"><span>三角形</span><b id="hTris">—</b></div>
  <div class="k"><span>人数</span><b id="hPeople">—</b></div>
  <div class="note">サーバ無しで動いています。<br>部屋の規則は本番と同じコードです。</div>
</div>

<aside class="panel card">
  <h3 id="floorName">—</h3>
  <ul id="members"></ul>
</aside>

<div class="editor card" id="editor">
  <h3>すがた <button id="closeEdit" title="閉じる">×</button></h3>
  <div class="row"><span>体型</span><select id="p_body"></select></div>
  <div class="row"><span>髪</span><select id="p_hair"></select></div>
  <div class="row"><span>上</span><select id="p_top"></select></div>
  <div class="row"><span>下</span><select id="p_bottom"></select></div>
  <div class="row"><span>靴</span><select id="p_shoe"></select></div>
  <div class="row"><span>小物</span><select id="p_acc"></select></div>
  <div class="foot">
    <button class="ctl" id="reroll">おまかせ</button>
    <small id="variety"></small>
  </div>
</div>

<div class="bar card">
  <button class="ctl" id="actBtn" disabled>—</button>
  <select class="ctl" id="statusSel">
    <option value="open">オープン</option>
    <option value="focus">集中中</option>
    <option value="meet">会議中</option>
    <option value="away">離席</option>
  </select>
  <button class="ctl" id="editBtn">すがた</button>
  <span class="hint" id="hint">WASD / 矢印・タップで移動・席の上で E</span>
</div>

<div class="toast" id="toast"></div>
<div id="boot">アバターと部屋を読み込んでいます…<br><small>3Dモデルは約 700 KB。テクスチャは1枚も使っていません</small></div>

<script type="importmap">
{ "imports": {
  "three": "./vendor/three.module.js",
  "three/": "./vendor/",
  "three/addons/": "./jsm/"
} }
</script>
<script type="module" src="./src/solo.js"></script>
</body>
</html>
